[package]
name = "chronoveil"
version = "0.1.0"
description = "ChronoVeil — 本地 AI 角色扮演聊天应用"
edition = "2021"

# 注意：版本号为骨架期的合理猜测，首次 cargo build 时以实际解析为准（阶段 2 起验证）。

[lib]
name = "chronoveil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Windows 资源嵌入（manifest 全目标统一嵌，见 build.rs）；版本随 tauri-build 内所引。
embed-resource = "=3.0.11"

[dependencies]
tauri = { version = "2", features = ["specta"] }
# 原生文件对话框（Task-04 角色卡导入/导出）：仅用 Rust 侧 API（DialogExt blocking），
# 不经前端 IPC 权限，capabilities 无需登记 dialog 权限项。
tauri-plugin-dialog = "2"
# 日志 facade（log 0.4 纯门面，无 IO）：domain/services 允许引用，不违反分层禁令
# （守卫只禁 tauri/rusqlite/reqwest）；具体后端由组合根的 tauri-plugin-log 装配。
log = "0.4"
# 日志插件后端（组合根专用）：Stdout 输出 + Info 级别；后续要文件落盘再扩展。
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 类型同源（ADR-010 / TASK-005）：tauri-specta 生成 TS bindings。
# 版本必须钉死（=）：tauri-specta v2 处于 rc，specta 系列互相要求精确匹配。
specta = "=2.0.0-rc.22"
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
rusqlite = { version = "0.36", features = ["bundled"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
